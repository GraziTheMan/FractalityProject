# render.yaml — Render Blueprint for the Fractality Platform
#
# READ THIS FIRST: a Blueprint only governs services Render created FROM a
# Blueprint. Both live services were created by hand in the dashboard, so today
# this file is documentation — accurate documentation, but Render is not reading
# it. Editing it does not change the running deployment.
#
# To make it authoritative, create the services from this Blueprint (New →
# Blueprint) or adopt the existing ones into it. Until then, the dashboard is the
# source of truth, and this file exists so that a service lost or recreated can
# be rebuilt without reconstructing its settings from memory.
#
# Values that are secret, or that only the dashboard knows, are marked
# `sync: false`. That means "this service has this variable; its value lives in
# the dashboard". Deliberate: hardcoding a guessed URL here would be worse than
# leaving it unset, because a Blueprint sync would then overwrite a working value
# with a wrong one.
#
# The frontend is a fully client-side SPA (Three.js rendering, localStorage
# persistence), so it deploys as a Static Site: free tier, global CDN, free TLS,
# and no idle spin-down. That is the right shape until there is a backend.
#
# Custom domain: add the app's hostname to this service in the Render dashboard
# (Settings -> Custom Domains) and point your DNS at the target Render shows.
# Certificates are issued automatically.
#
# PLANNED: the app moves to a subdomain — fp.fractiverse.com — leaving the root
# domain free to be a landing page for the several platforms under it. Nothing in
# the application code depends on the hostname (base is './', there is no
# path-based routing, share links are '/?map=...', and the API base is an env var),
# so the move is entirely configuration:
#
#   1. Add fp.fractiverse.com to THIS service in Render (Settings -> Custom
#      Domains) BEFORE touching DNS. Render routes by the Host header, so a name
#      that resolves here but is not registered on the service gets Render's own
#      404, and the DNS looks broken when it is not. Render then shows the exact
#      CNAME target to use.
#   2. In DNS, add:  CNAME  fp  ->  <this-service>.onrender.com   (DNS only)
#
#      Point it at the RENDER HOST, never at fractiverse.com. An alias of the apex
#      would follow the apex to the landing page at step 4 and take the app down —
#      the record would be aliasing the app to the thing that is about to stop
#      being the app. Match the existing www record, which already does this.
#   3. Add the new origin to the API's CORS_ORIGIN, below.
#   4. Add the subdomain to Clerk (Domains). A Clerk production instance is
#      configured for one primary domain and its CNAMEs; verify sign-in on the new
#      origin before removing the old one.
#   5. Only then point the apex AND www at whatever serves the landing page, and
#      narrow CORS_ORIGIN to the subdomain alone.
#
# Do the app first and the landing page last, so there is never a moment when the
# only working origin is the one being replaced.
#
# www matters as much as the apex: it currently serves the app, and the app should
# end up on EXACTLY ONE origin. Two origins serving it means two independently
# installable apps with separate service workers and separate caches, and people
# install whichever one they happened to land on.
#
# What Email Routing calls a "subdomain" is unrelated to any of this — it is for
# receiving mail at name@fp.fractiverse.com, and it puts MX records on the label
# the CNAME needs. Not required, and worth avoiding.
#
# The ORDER matters more than it looks, for one reason: a PWA's identity — its
# installed app, its service worker, its caches — is scoped to an origin and cannot
# be migrated. An app installed from the root domain would keep pointing there
# after the move, with no way to tell it otherwise. Settling the hostname before
# anyone installs is the cheap version of this decision; afterwards it costs every
# installed copy.
#
# If the root domain HAS ever served sw.js by the time it becomes a landing page,
# it needs a self-unregistering worker left at that origin for a while — a browser
# holds a registration until something replaces it. Check before assuming: an
# origin that never served a worker needs nothing.
#
# NOTE ON ENV VARS: Vite substitutes VITE_* at BUILD time, so changing one
# requires a redeploy, not a restart. Never put a provider API key in a VITE_
# var — it is compiled into the bundle that every visitor downloads.

services:
  - type: web
    name: fractality-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    # Single-page app: serve index.html for paths that aren't real files, so
    # deep links and refreshes don't 404.
    #
    # Real files win over this rule, which matters most for /sw.js: a rewrite
    # that swallowed it would serve index.html as the service worker, and
    # registration would fail on the content type with the app otherwise fine.
    # The running deploy already demonstrates the precedence — /assets/*.js is
    # served as itself, not as index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # The bundle filenames are content-hashed, so they can be cached hard.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html must not be cached, or clients pin to an old bundle.
      - path: /index.html
        name: Cache-Control
        value: no-cache

      # --- Installable-app files (public/, so NOT content-hashed) -----------
      #
      # sw.js must not be cached. A service worker is the only file that can pin
      # a user to an old build permanently: the browser re-fetches it to look for
      # updates, and if that fetch is answered from cache, the update is never
      # seen and there is nothing the user can do about it from inside the app.
      # Browsers cap service-worker script caching at 24h regardless, but relying
      # on that means a full day of shipping to nobody.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      # Also served from the root because a worker's scope is limited to the
      # directory it is served from — at /assets/sw.js it could not control the
      # app it is meant to control.

      # An unknown extension is served as a generic type, and Chrome ignores a
      # manifest whose content type is not JSON-ish, which fails silently as
      # "this app is not installable" with no error anywhere. Stated explicitly
      # rather than trusted to Render's MIME table.
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /manifest.webmanifest
        name: Cache-Control
        value: public, max-age=3600

      # Icon filenames are fixed, so `immutable` would pin the old artwork for a
      # year. A day is long enough to be free on relaunch and short enough that a
      # redraw actually lands. must-revalidate keeps a stale copy from being used
      # after it expires.
      - path: /icons/*
        name: Cache-Control
        value: public, max-age=86400, must-revalidate

      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    envVars:
      # The API's base URL. Set in the dashboard; sync: false rather than a
      # literal because the deployed service's hostname is not recorded here.
      - key: VITE_API_BASE
        sync: false

      # Clerk PUBLISHABLE key (pk_...). Safe as a VITE_ variable by design —
      # publishable keys are meant to be public, which is the whole point of the
      # publishable/secret split. Clerk's SECRET key must never be a VITE_
      # variable, and is not used anywhere in this project.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false

      # Chat, step 5. Both stay unset until the realtime server exists; the app
      # checks for them and disables chat rather than erroring.
      # - key: VITE_SOCKET_URL
      #   sync: false
      # - key: VITE_AI_PROXY_URL
      #   sync: false

      - key: NODE_VERSION
        value: "22"

  # --- API service (api/) --------------------------------------------------
  #
  # This service is live. Its configuration below mirrors the dashboard.
  #
  # On the plan: `free` is what is running now, and it is a real trade-off rather
  # than a placeholder. A free instance spins down after ~15 minutes idle, and the
  # next request waits roughly 50 seconds for it to boot. That hurts MORE at low
  # traffic, not less: a handful of people checking in a couple of times a day
  # means almost every visit is a cold start. Reads retry through it (see
  # MindMapClient._request), so it works — it just looks broken while it waits.
  #
  # Move to `starter` when either of these is true:
  #   * chat exists — spin-down drops WebSocket connections, so it is not a slow
  #     experience but a broken one
  #   * you are showing it to anyone whose first impression matters
  #
  # AuraDB has its own, independent idle pause (a few days), which no Render plan
  # affects.
  - type: web
    name: fractality-api
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production

      # Must list every origin the site is served from, comma-separated, and match
      # EXACTLY — scheme, host, no trailing slash. https://www.fractiverse.com is a
      # DIFFERENT origin from https://fractiverse.com to a browser, and listing
      # only one is what broke the deployed app once already. A wildcard is
      # refused at boot in production, because browsers reject wildcard +
      # credentials and every request here carries an Authorization header.
      #
      # On the planned move to a subdomain: add the new origin BEFORE changing any
      # DNS, and keep the old ones until the move is done. This variable is a list
      # precisely so that two origins can work at once; a migration with one entry
      # in it has a window where the app cannot reach its own API.
      - key: CORS_ORIGIN
        value: https://fractiverse.com,https://www.fractiverse.com

      # Neo4j is NOT hosted on Render. These come from the AuraDB credentials
      # file, pasted verbatim.
      #
      # Note the spelling: current Aura issues NEO4J_USERNAME, and its value is
      # the instance ID (matching the URI subdomain), not "neo4j". Both spellings
      # are accepted by api/settings.py; this is the one Aura gives you.
      #
      # NEO4J_DATABASE is deliberately absent. Leaving it unset lets the server
      # choose its own default, which is correct for Aura — forcing the name
      # "neo4j" is what produced DatabaseNotFound.
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false

      # Clerk's ISSUER url, not either of its keys. Tokens are verified against
      # Clerk's published JWKS, so no secret is stored here at all.
      - key: CLERK_ISSUER
        sync: false

      # Optional limits; the defaults in api/settings.py are used when unset.
      # - key: MAX_PULSES_PER_HOUR
      #   value: "20"
      # - key: MAX_NODES_PER_MAP
      #   value: "10000"
      # - key: MAX_MAPS_PER_USER
      #   value: "500"

      # For the AI proxy (step 5). Server-side only — never a VITE_ variable, or
      # it would be compiled into the bundle every visitor downloads.
      # - key: ANTHROPIC_API_KEY
      #   sync: false
