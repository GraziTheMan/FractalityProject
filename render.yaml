# render.yaml — Render Blueprint for the Fractality Platform
#
# The frontend is a fully client-side SPA (Three.js rendering, localStorage
# persistence), so it deploys as a Static Site: free tier, global CDN, free TLS,
# and no idle spin-down. That is the right shape until there is a backend.
#
# Custom domain: add fractiverse.com to this service in the Render dashboard
# (Settings -> Custom Domains) and point your DNS at the target Render shows.
# Certificates are issued automatically.
#
# NOTE ON ENV VARS: Vite substitutes VITE_* at BUILD time, so changing one
# requires a redeploy, not a restart. Never put a provider API key in a VITE_
# var — it is compiled into the bundle that every visitor downloads.

services:
  - type: web
    name: fractality-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    # Single-page app: serve index.html for paths that aren't real files, so
    # deep links and refreshes don't 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # The bundle filenames are content-hashed, so they can be cached hard.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html must not be cached, or clients pin to an old bundle.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    envVars:
      # Backend endpoints. Leave unset until the API exists; the app detects
      # their absence and degrades rather than erroring.
      # - key: VITE_API_BASE
      #   value: https://api.fractiverse.com
      # - key: VITE_SOCKET_URL
      #   value: https://api.fractiverse.com
      # - key: VITE_AI_PROXY_URL
      #   value: https://api.fractiverse.com/ai
      #
      # Clerk PUBLISHABLE key. Safe here by design — publishable keys are meant
      # to be public. Clerk's SECRET key must never be a VITE_ variable, and is
      # not used by this project at all.
      # - key: VITE_CLERK_PUBLISHABLE_KEY
      #   sync: false
      - key: NODE_VERSION
        value: "22"

  # --- API service (api/) --------------------------------------------------
  #
  # Commented out until you have AuraDB and Clerk credentials to hand. Once you
  # do, uncomment, set the secrets in the dashboard, then point VITE_API_BASE
  # above at this service's URL and redeploy the static site.
  #
  # Things that are not optional:
  #   * `plan: starter`, not free. Idle spin-down drops WebSocket connections,
  #     and cold starts on a paused instance make the API look broken.
  #   * Neo4j is NOT hosted on Render. Use Neo4j AuraDB (Free tier is fine to
  #     start) and set the credentials as secrets — sync: false keeps them out
  #     of this file and out of git.
  #   * CORS_ORIGIN must be your real frontend origin. The app refuses to boot
  #     in production on a wildcard, because browsers reject wildcard + credentials.
  #
  # - type: web
  #   name: fractality-api
  #   runtime: python
  #   plan: starter
  #   buildCommand: pip install -r api/requirements.txt
  #   startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
  #   healthCheckPath: /health
  #   envVars:
  #     - key: ENVIRONMENT
  #       value: production
  #     - key: CORS_ORIGIN
  #       value: https://fractiverse.com
  #     - key: NEO4J_URI
  #       sync: false
  #     - key: NEO4J_USER
  #       sync: false
  #     - key: NEO4J_PASSWORD
  #       sync: false
  #     - key: CLERK_ISSUER
  #       sync: false
  #     # For the future AI proxy (step 5). Server-side only — never VITE_.
  #     - key: ANTHROPIC_API_KEY
  #       sync: false
  #     - key: OPENAI_API_KEY
  #       sync: false
